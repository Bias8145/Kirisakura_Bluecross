name: Integrate Q1 KSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Q1 target
        uses: actions/checkout@v4
        with:
          ref: Release_Q_1-ksunext-susfs
          fetch-depth: 0

      - name: Cherry-pick all requested commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add source https://github.com/Bias8145/android_kernel_google_msm-4.9.git
          git fetch --no-tags source thirteen-next-2

          mapfile -t commits < <(git log source/thirteen-next-2 --since='2026-05-21 00:00:00 +0000' --until='2026-07-19 00:00:00 +0000' --reverse --format='%H')
          echo "Found ${#commits[@]} commits"
          test "${#commits[@]}" -gt 0

          for commit in "${commits[@]}"; do
            echo "=== $commit ==="
            if git cherry-pick -x "$commit"; then
              continue
            fi
            echo 'Conflict detected; resolving with source branch content.'
            git checkout --theirs -- .
            git add -A
            if git cherry-pick --continue; then
              continue
            fi
            if git diff --cached --quiet; then
              git cherry-pick --skip
            else
              echo 'Unable to resolve cherry-pick safely.'
              git cherry-pick --abort
              exit 1
            fi
          done

          test -f drivers/kernelsu/ksu.c
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          git push origin HEAD:Release_Q_1-ksunext-susfs
