name: Integrate Q1 KSU Next SUSFS

on:
  workflow_dispatch:
  push:
    branches:
      - Release_Q_1-ksunext-susfs

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: trigger Q1 KSU SUSFS integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Q1 target
        uses: actions/checkout@v4
        with:
          ref: Release_Q_1-ksunext-susfs
          fetch-depth: 0
          submodules: false

      - name: Integrate all commits from requested period
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add source https://github.com/Bias8145/android_kernel_google_msm-4.9.git
          git fetch --no-tags source thirteen-next-2

          mapfile -t commits < <(git log source/thirteen-next-2 --since='2026-05-21 00:00:00 +0000' --until='2026-07-19 00:00:00 +0000' --reverse --format='%H')
          echo "Found ${#commits[@]} commits in requested period"
          test "${#commits[@]}" -eq 72

          for commit in "${commits[@]}"; do
            echo "=== Cherry-picking $commit ==="
            if ! git cherry-pick -x "$commit"; then
              echo 'CONFLICT: stopping safely; no automatic overwrite of Q1 content.'
              git status --short
              git cherry-pick --abort
              exit 1
            fi
          done

          echo '=== Integration complete ==='
          echo "Applied ${#commits[@]} commits"
          echo '=== KSU/SUSFS paths ==='
          find drivers -maxdepth 3 -type f -iname '*ksu*' -print 2>/dev/null || true
          find fs include -type f \( -name 'susfs.c' -o -name 'susfs.h' \) -print 2>/dev/null || true
          git status --short
          git push origin HEAD:Release_Q_1-ksunext-susfs
