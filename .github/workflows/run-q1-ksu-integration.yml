name: Run Q1 KSU SUSFS Integration

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Q1 branch to integrate into
        required: true
        default: Release_Q_1-ksunext-susfs
        type: string

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.inputs.target_branch == 'Release_Q_1-ksunext-susfs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Q1 target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0
          submodules: false

      - name: Integrate all 72 requested commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add source https://github.com/Bias8145/android_kernel_google_msm-4.9.git
          git fetch --no-tags source thirteen-next-2

          mapfile -t commits < <(git log source/thirteen-next-2 --since='2026-05-21 00:00:00 +0000' --until='2026-07-19 00:00:00 +0000' --reverse --format='%H')
          echo "Found ${#commits[@]} commits in requested period"
          test "${#commits[@]}" -eq 72

          for i in "${!commits[@]}"; do
            commit="${commits[$i]}"
            echo "=== [$((i+1))/72] Cherry-picking $commit ==="
            git cherry-pick -x "$commit"
          done

          echo '=== Integration complete: 72/72 ==='
          git status --short
          git push origin "HEAD:${{ github.event.inputs.target_branch }}"
