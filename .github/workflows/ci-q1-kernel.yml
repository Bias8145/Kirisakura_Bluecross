name: CI Q1 Kernel

on:
  push:
    branches:
      - Release_Q_1-ksunext-susfs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Q1 KSU Next SUSFS
        uses: actions/checkout@v4
        with:
          ref: Release_Q_1-ksunext-susfs
          fetch-depth: 0
          submodules: false

      - name: Validate KSU Next and SUSFS
        shell: bash
        run: |
          set -euo pipefail
          test -d drivers/kernelsu
          test -f drivers/kernelsu/ksu.c
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          if git ls-files --stage KernelSU-Next | grep -q '^160000 '; then
            echo 'ERROR: unconfigured KernelSU-Next gitlink remains'
            exit 1
          fi
          echo 'Q1 KSU Next + SUSFS tree validation passed.'
          echo "HEAD=$(git rev-parse HEAD)"
