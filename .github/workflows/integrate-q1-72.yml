name: Integrate Q1 - 72 KSU SUSFS commits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: Release_Q_1-ksunext-susfs
          fetch-depth: 0
          submodules: false

      - name: Cherry-pick all commits from requested period
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add source https://github.com/Bias8145/android_kernel_google_msm-4.9.git
          git fetch --no-tags source thirteen-next-2

          mapfile -t commits < <(git log source/thirteen-next-2 --since='2026-05-21 00:00:00 +0000' --until='2026-07-19 00:00:00 +0000' --reverse --format='%H')
          echo "Found ${#commits[@]} commits in requested period"
          test "${#commits[@]}" -eq 72

          for commit in "${commits[@]}"; do
            echo "=== Cherry-pick $commit ==="
            git cherry-pick -x "$commit" || {
              echo 'Conflict detected. Stopping for inspection instead of discarding Q1 changes.'
              git status --short
              git diff --name-only --diff-filter=U
              exit 1
            }
          done

      - name: Remove broken KernelSU gitlink only if present
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -s KernelSU-Next | grep -q '^160000 '; then
            echo 'Broken KernelSU-Next gitlink detected; removing gitlink from final tree.'
            git rm --cached -f KernelSU-Next
            rm -rf KernelSU-Next
            git commit -m 'fix: remove unresolved KernelSU-Next gitlink'
          fi

      - name: Verify KSU Next SUSFS
        shell: bash
        run: |
          set -euo pipefail
          test -d drivers/kernelsu
          test -f drivers/kernelsu/ksu.c
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          grep -Rqs 'SUSFS' drivers/kernelsu fs include/linux
          grep -Rqs 'KSU' drivers/kernelsu
          echo 'KSU Next + SUSFS source verification passed.'

      - name: Push integrated branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:Release_Q_1-ksunext-susfs
